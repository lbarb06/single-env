name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC to AWS
  contents: read
  pull-requests: write

concurrency:
  group: terraform-single-env
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: validate
        run: terraform validate

      - name: plan
        shell: bash # -eo pipefail so a failed plan fails the step despite tee
        run: terraform plan -input=false -no-color -var aws_profile= -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan\n```\n' + plan + '\n```',
            });

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tfplan
          path: tfplan

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false -backend-config=backend.hcl

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: apply
        run: terraform apply -input=false tfplan

      - name: Show URL
        run: |
          echo "### Deployed: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
